[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Static output with build.format "file" serves /websites from websites.html
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Old routes -> new routes (301)
[[redirects]]
  from = "/websites"
  to = "/pay-monthly-websites/"
  status = 301
  force = true

[[redirects]]
  from = "/websites/"
  to = "/pay-monthly-websites/"
  status = 301
  force = true

[[redirects]]
  from = "/google-business-profile"
  to = "/google-business-profile-management/"
  status = 301
  force = true

[[redirects]]
  from = "/google-business-profile/"
  to = "/google-business-profile-management/"
  status = 301
  force = true
